{% extends 'base.html'%}
{%block title%} Reset Password {%endblock%}

{%block main%}
{% load static %}
<style>
    .error-msg {
        color: red;
        font-size: 14px;
        display: block;
        margin-top: 5px;
    }
    .submit-error {
        color: red;
        font-size: 15px;
        font-weight: bold;
        text-align: center;
        margin-top: 15px;
        margin-bottom: 5px;
        display: none;
    }
</style>

<!-- //w3l-header -->
<section class="w3l-booking-top">
    <!-- /form-16-section -->
    <div class="booking-form-61">
        <div class="container">
            <div class="row">
            <div class="col-3"></div>
            <div class="col-6">
                <div class="form-right-inf">
                    <div class="booking-form-content">
                        <h6>Reset Password</h6>
                        <form action="/resetpassword" class="book-depature-6 signin-form" id="resetpwdform" method="post">
                            {%csrf_token%}
                            <div class="d-grid grid-col-4">
                                <div class="hny-frm_grid">
                                    <h5>New Password</h5>
                                    <input class="email" id="resetPwdInput" name="password" type="password" placeholder="Enter New Password" required>
                                    <span id="resetPwdError" class="error-msg"></span>
                                </div>
                                <div class="hny-frm_grid mt-3">
                                    <h5>Confirm Password</h5>
                                    <input class="email" id="resetConfirmPwdInput" name="confirmpassword" type="password" placeholder="Confirm New Password" required>
                                    <span id="resetConfirmPwdError" class="error-msg"></span>
                                </div>
                                <div id="resetPwdSubmitError" class="submit-error">Please fill all required fields correctly!</div>
                                <button type="submit" class="btn btn-style btn-secondary book mt-4">Reset Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
</section>

{%endblock%}
